services:
  postgres:
    image: postgres:17-alpine
    container_name: discord-screen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_screen
      POSTGRES_PASSWORD: discord_screen
      POSTGRES_DB: discord_screen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_screen -d discord_screen"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: discord-screen-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres_data:
